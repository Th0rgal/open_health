[package]
name = "oura-store"
description = "SQLite persistence for Oura ring events, samples, metrics and sync state"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/open_oura"

[dependencies]
oura-protocol = { git = "https://github.com/Th0rgal/open_oura", rev = "99e0f4c4b3293772c16447708acfc3623cf3810f" }
rusqlite = { version = "0.31", features = ["backup"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
