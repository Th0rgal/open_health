[package]
name = "oura-store"
description = "SQLite persistence for Oura ring events, samples, metrics and sync state"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Th0rgal/open_oura"

[dependencies]
oura-protocol = { git = "https://github.com/Th0rgal/open_oura", rev = "0a703728ca5071c10addf0f680a4293c8a0f193e" }
rusqlite = { version = "0.31", features = ["backup"] }
serde_json = "1"
thiserror = "1"

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
