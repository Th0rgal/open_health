[package]
name = "oura-cli"
description = "Command-line client for reading data directly from an Oura ring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oura"
path = "src/main.rs"

[dependencies]
oura-protocol = { git = "https://github.com/manueldeprada/open_oura", rev = "d31d904789fd60493b7fabe84910071f2d7e7de1" }
oura-link = { git = "https://github.com/manueldeprada/open_oura", rev = "d31d904789fd60493b7fabe84910071f2d7e7de1" }
oura-store = { git = "https://github.com/manueldeprada/open_oura", rev = "d31d904789fd60493b7fabe84910071f2d7e7de1" }
oura-summary = { path = "../oura-summary" }
oura-dna = { path = "../oura-dna" }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
hex = "0.4"
serde_json = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
# Outbound HTTPS is used ONLY to fetch PUBLIC PGS Catalog score *definitions* from
# EBI on explicit user action (see dna.rs); no genome/personal data is ever sent.
# rustls (no system OpenSSL) keeps the macOS build turnkey.
ureq = { version = "2", default-features = false, features = ["tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.3"
tch = { version = "=0.22.0", optional = true } # pinned to libtorch 2.9.0 (repo venv)

[features]
# Run the activity model in-process via LibTorch instead of shelling out to
# tools/run_activity_model.py. On Apple Silicon the only libtorch is the pip
# wheel, so the repo venv is aligned to torch 2.9.0 — the exact version tch 0.22
# targets — and we link against it (no version-check bypass needed). build.rs
# bakes the rpath, so no DYLD_LIBRARY_PATH at runtime:
#   export PATH="$PWD/.venv/bin:$PATH" LIBTORCH_USE_PYTORCH=1
#   cargo run --features torch -- sessions --tz-offset 1
torch = ["dep:tch"]
