[package]
name = "oura-ffi"
description = "C-ABI surface over the shared analysis core, for the iOS/native clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib → liboura_ffi.a to link into the iOS app; cdylib is handy for desktop tests.
crate-type = ["staticlib", "lib"]

[dependencies]
oura-analysis = { git = "https://github.com/Th0rgal/open_oura", rev = "0a703728ca5071c10addf0f680a4293c8a0f193e" }
