[package]
name = "oura-ffi"
description = "C-ABI surface over the shared analysis core, for the iOS/native clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib → liboura_ffi.a to link into the iOS app; cdylib is handy for desktop tests.
crate-type = ["staticlib", "lib"]

[dependencies]
oura-analysis = { git = "https://github.com/manueldeprada/open_oura", rev = "d31d904789fd60493b7fabe84910071f2d7e7de1" }
