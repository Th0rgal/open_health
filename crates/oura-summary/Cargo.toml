[package]
name = "oura-summary"
description = "The dashboard summary computation, shared by the web (oura-cli) and native (oura-core) clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oura-protocol = { git = "https://github.com/manueldeprada/open_oura", rev = "a0d3eada2fa8a48f16217e5ccfca6680eddf9c1e" }
oura-store = { git = "https://github.com/manueldeprada/open_oura", rev = "a0d3eada2fa8a48f16217e5ccfca6680eddf9c1e" }
oura-analysis = { git = "https://github.com/manueldeprada/open_oura", rev = "a0d3eada2fa8a48f16217e5ccfca6680eddf9c1e" }
serde_json = "1"
anyhow = "1"
rusqlite = "0.31"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
